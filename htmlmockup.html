    <script>

      function angleFor(orient) {
          return (orient - 1) * 60;
      }

      const timingSettings =
            {
                duration: 500,
                /* easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'*/
            };


      async function flipTile(hd) {
          const oa = angleFor(Number(hd.getAttribute("orientation") ?? 1));
          const rotateY = (deg) => {
              const rad = (oa) * Math.PI / 180;
              const x = Math.sin(-rad);
              const y = Math.cos(-rad);
              return {
                  transform: ` rotate3d(${x}, ${y}, 0, ${deg}deg) rotateZ(${oa}deg) `
              }
          };
          hd.animate([rotateY(0), rotateY(90)], timingSettings)
              .finished
              .then(
                  () => hd.setAttribute("side", String(3 - (hd.getAttribute("side") ?? 1))))
              .then(
                  () => hd.animate([rotateY(90), rotateY(0)], timingSettings).finished)
          ;
      }

      async function rotateTile(hd, reverse) {
          const orient = Number(hd.getAttribute("orientation") ?? 1);
          let next = orient;
          if (reverse) {
              next--;
          } else {
              next++;
          }
          const degrees = angleFor(next);
          if (next == 0) { next = 6; }
          else if (next == 7) { next = 1; }
          const anims = [];
          const rotate = (deg) => {
              return {
                  transform: [`rotate(${deg}deg)`]
              }
          };
          // rotate the tile
          anims.push(hd.animate(rotate(degrees), timingSettings));
          Promise.all(anims.map(a => a.finished))
              .then(() => hd.setAttribute('orientation', String(next)));
      }

      async function handleClick(event) {
          let hd = event.target;
          if (!hd.getAttribute('tile')) {
              return false;
          }
          if (event.metaKey) {
              return flipTile(hd);
          }
          return rotateTile(hd, event.shiftKey);
      }

      const size = 200;
      const xh = size/2;
      const xw = xh * Math.sqrt(3);

      function setLoc(hexdiv, row, col) {
          hexdiv.style.top = `${row * xh}px`;
          hexdiv.style.left = `${col * xw}px`;
      }

      function setAllLoc() {
          document.documentElement.style = `--hex-size: ${size}px`;
          document.querySelectorAll(".village [tile]").forEach(e => {
              const r = Number(e.getAttribute("r"));
              const c = Number(e.getAttribute("c"));
              e.onclick = (ev) => handleClick(ev);
              setLoc(e, r, c);
          });
          season('spring');
      }

      const seasonColors = {
          spring: '#8aa14e',
          summer: '#d0ca72',
          fall: '#b7793b',
          winter: '#aaaaaa'
      }

      function season(s) {
          document.documentElement.style
              .setProperty('--season-color', seasonColors[s]);
      }
    </script>
